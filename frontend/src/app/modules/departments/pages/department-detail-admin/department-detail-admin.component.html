<!-- Modal Overlay -->
<div *ngIf="showForm" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <!-- Modal Box -->
  <div class="relative w-full max-w-md rounded bg-white p-6 shadow-lg dark:bg-gray-900">
    <h2 class="mb-4 text-xl font-bold text-gray-900 dark:text-white">Create Department</h2>

    <!-- Form fields -->
    <input
      type="text"
      class="mb-3 w-full rounded border p-2"
      placeholder="Department Name"
      [(ngModel)]="newDepartment.name" />

    <!-- Supervisor Dropdown -->
    <select
      class="mb-4 w-full rounded border p-2"
      [(ngModel)]="newDepartment.supervisorEmail">
      <option value="" disabled selected>Select Supervisor</option>
      <option *ngFor="let sup of supervisors" [value]="sup.email">
        {{ sup.email }}
      </option>
    </select>

    <!-- Buttons -->
    <div class="flex justify-end space-x-2">
      <app-button tone="warning" shape="rounded" impact="bold" size="medium" (click)="toggleForm()">
        Cancel
      </app-button>

      <app-button tone="success" shape="rounded" impact="bold" size="medium" (click)="submitDepartment()">
        Submit
      </app-button>
    </div>
  </div>
</div>

<!-- Header -->
<div class="mb-4 flex justify-between">
  <div class="inline-block">
    <h3 class="text-foreground font-semibold">Departments</h3>
    <div class="text-muted-foreground space-x-1 text-xs font-medium">
      <span>Total:</span>
      <span class="text-foreground">{{ departments.length }}</span>
    </div>
  </div>
  <app-button tone="primary" shape="rounded" impact="bold" size="medium" (click)="toggleForm()" class="mb-4">
    + Create Department
  </app-button>
</div>

<!-- Table -->
<div class="border-muted/20 bg-background flex min-w-full flex-col rounded-xl border p-2">
  <div class="overflow-x-auto px-5">
    <table
      class="text-muted-foreground table w-full table-auto border-collapse border-0 text-left align-middle leading-5">
      <thead class="border-muted/20 text-muted-foreground border text-xs">
        <tr>
          <th class="px-2 py-3">Name</th>
          <th class="px-2 py-3">Supervisor Email</th>
          <th class="px-2 py-3">Shiftplan</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dept of departments; let i = index" class="hover:bg-card/50">
          <td class="px-2 py-3">{{ dept.name }}</td>
          <td class="px-2 py-3">{{ dept.supervisorEmail }}</td>
          <td class="px-2 py-3" [routerLink]="['/departments', dept.name, 'shiftplan-editor']">
            <div class="flex items-center space-x-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-gray-600"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5.25 21h13.5a2.25 2.25 0 0 0 2.25-2.25V7.5A2.25 2.25 0 0 0 18.75 5.25H5.25A2.25 2.25 0 0 0 3 7.5v11.25A2.25 2.25 0 0 0 5.25 21z" />
              </svg>
              <span class="text-sm font-medium text-gray-700">Click me</span>
            </div>
          </td>
        </tr>
        <tr *ngIf="departments.length === 0">
          <td class="py-4 text-center text-sm" colspan="3">No departments found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
