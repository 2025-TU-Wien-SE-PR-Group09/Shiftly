<div class="border-muted/50 bg-background flex min-w-full flex-col rounded-xl border p-6 px-6 pb-6 space-y-6">
  <h2 class="text-2xl font-bold text-black dark:text-white">Sick Leave Certificates</h2>

  <div class="border rounded p-4 bg-gray-100 border-gray-300 dark:border-gray-600 dark:bg-gray-900 shadow">
    <div class="overflow-x-auto px-5">
      <table class="text-black dark:text-gray-200 table w-full table-auto border-collapse border-0 text-left align-middle leading-5">
        <thead class="text-black dark:text-white text-sm">
        <tr>
          <th class="py-2">Uploaded</th>
          <th class="py-2">Start</th>
          <th class="py-2">End</th>
          <th class="py-2">Employee</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let note of sickNotes" class="hover:bg-muted/20 transition text-sm">
          <td class="py-1">{{ note.uploadedAt | date:'dd.MM.yyyy' }}</td>
          <td class="py-1">{{ note.startDate | date:'dd.MM.yyyy' }}</td>
          <td class="py-1">{{ note.endDate | date:'dd.MM.yyyy' }}</td>
          <td class="py-1">{{ note.employeeEmail }}</td>
        </tr>

        <tr *ngIf="sickNotes.length === 0">
          <td colspan="4" class="text-center py-4 text-gray-500 dark:text-gray-400">
            No certificates found.
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
