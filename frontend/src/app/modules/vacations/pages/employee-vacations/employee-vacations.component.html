<div class="p-6 flex flex-col lg:flex-row gap-6">

  <div class="w-full lg:w-1/2">
    <h2 class="text-2xl font-bold mb-4 text-black dark:text-white">Submit Vacation Request</h2>

    <form (ngSubmit)="submitVacationRequest()" class="space-y-4 rounded-xl border border-gray-300 dark:border-gray-600 p-6 shadow-md dark:bg-gray-900">
      <div>
        <label for="start" class="block mb-1 font-medium text-black dark:text-white">Start Date</label>
        <input
          type="date"
          id="start"
          name="start"
          [(ngModel)]="startDate"
          class="w-full border p-2 rounded text-black dark:text-white dark:bg-gray-800 dark:border-gray-600"
          required
        />
      </div>

      <div>
        <label for="end" class="block mb-1 font-medium text-black dark:text-white">End Date</label>
        <input
          type="date"
          id="end"
          name="end"
          [(ngModel)]="endDate"
          class="w-full border p-2 rounded text-black dark:text-white dark:bg-gray-800 dark:border-gray-600"
          required
        />
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button
          type="button"
          class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition"
          (click)="startDate = ''; endDate = ''"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="bg-primary text-white px-4 py-2 rounded hover:opacity-90 transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>


  <div class="w-full lg:w-1/2">
    <h2 class="text-2xl font-bold mb-4 text-black dark:text-white">Your Vacation Requests</h2>

    <div class="border rounded p-4 border-gray-300 dark:border-gray-600 dark:bg-gray-900">
      <table class="w-full text-left text-sm text-black dark:text-white">
        <thead>
        <tr>
          <th class="px-2 py-2">Start</th>
          <th class="px-2 py-2">End</th>
          <th class="px-2 py-2">Status</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let req of vacationRequests">
          <td class="px-2 py-2">{{ req.startDate }}</td>
          <td class="px-2 py-2">{{ req.endDate }}</td>
          <td class="px-2 py-2">{{ req.status }}</td>
        </tr>
        <tr *ngIf="vacationRequests.length === 0">
          <td colspan="3" class="text-center py-4 text-gray-500 dark:text-gray-400">
            No vacation requests found.
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
